<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFF1FA"/>
      <stop offset="45%" stop-color="#EDF7FC"/>
      <stop offset="100%" stop-color="#FAD4E0"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3888B8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Phone Glass Body -->
  <g filter="url(#shadow)">
    <rect x="136" y="96" width="240" height="320" rx="44" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Dynamic notch pill -->
    <rect x="216" y="116" width="80" height="14" rx="7" fill="#2C4A5C" fill-opacity="0.75"/>
    <circle cx="282" cy="123" r="3" fill="#38BDF8"/>
    
    <!-- Screen content preview: Glass tiles -->
    <rect x="156" y="152" width="94" height="94" rx="20" fill="#38BDF8" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="262" y="152" width="94" height="94" rx="20" fill="#F472B6" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="156" y="258" width="94" height="94" rx="20" fill="#34D399" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="262" y="258" width="94" height="94" rx="20" fill="#A78BFA" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Central heart/sparkle emblem -->
    <circle cx="256" cy="252" r="32" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M256 238 C256 238 244 246 244 254 C244 259 248 263 253 263 C256 263 256 261 256 261 C256 261 256 263 259 263 C264 263 268 259 268 254 C268 246 256 238 256 238 Z" fill="#E11D48"/>
    
    <!-- Home bar -->
    <rect x="216" y="396" width="80" height="6" rx="3" fill="#2C4A5C" fill-opacity="0.4"/>
  </g>
</svg>
